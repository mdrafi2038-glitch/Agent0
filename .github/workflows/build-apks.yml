name: Build Personal Agent APKs

on:
  push:
    branches: [main]
    paths:
      - 'private-agent.zip'
      - 'customize_split_apps.py'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f private-agent.zip || { echo "private-agent.zip was not found at repository root"; exit 1; }
          mkdir -p extracted
          unzip -q private-agent.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Split Client and Admin app experiences
        shell: bash
        run: |
          set -euo pipefail
          python3 customize_split_apps.py "$PROJECT_DIR"
          echo "Configured separate Client and Admin flavors."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleClientDebug assembleAdminDebug --stacktrace

      - name: Collect separate APKs and updated source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output/source
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -print
          CLIENT_APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | grep -i '/client/' | head -1 || true)"
          ADMIN_APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | grep -i '/admin/' | head -1 || true)"
          if [ -z "$CLIENT_APK" ] || [ -z "$ADMIN_APK" ]; then
            echo "Could not identify both Client and Admin APKs."
            find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec ls -lh {} \;
            exit 1
          fi
          cp "$CLIENT_APK" release-output/PersonalAgent-Client-debug.apk
          cp "$ADMIN_APK" release-output/PersonalAgent-Admin-debug.apk
          # Package the customized source, excluding caches and build outputs.
          tar -C "$PROJECT_DIR" --exclude='**/build' --exclude='.gradle' --exclude='.idea' -czf release-output/source/PersonalAgent-Updated-Source.tar.gz .
          (cd release-output && sha256sum PersonalAgent-Client-debug.apk PersonalAgent-Admin-debug.apk source/PersonalAgent-Updated-Source.tar.gz > SHA256SUMS.txt)
          ls -lh release-output/PersonalAgent-Client-debug.apk release-output/PersonalAgent-Admin-debug.apk release-output/source/PersonalAgent-Updated-Source.tar.gz

      - name: Upload Client APK separately
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-Client-APK
          path: release-output/PersonalAgent-Client-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Admin APK separately
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-Admin-APK
          path: release-output/PersonalAgent-Admin-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload updated source separately
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-Updated-Source
          path: release-output/source/PersonalAgent-Updated-Source.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-SHA256SUMS
          path: release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
