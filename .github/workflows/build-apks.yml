name: Build Personal Agent APKs

on:
  push:
    branches: [main]
    paths:
      - 'private-agent.zip'
      - 'customize_split_apps.py'
      - '.github/workflows/build-apks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f private-agent.zip || { echo "private-agent.zip was not found at repository root"; exit 1; }
          mkdir -p extracted
          unzip -q private-agent.zip -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            echo "ZIP contents:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Split Client and Admin app experiences
        shell: bash
        run: |
          set -euo pipefail
          python3 customize_split_apps.py "$PROJECT_DIR"
          echo "Configured separate Client and Admin flavors."

      - name: Ensure debug signing keystore exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f extracted/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore extracted/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleClientDebug assembleAdminDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} apk-output/ \;
          if ! find apk-output -type f -name '*.apk' | grep -q .; then
            echo "Build finished but no APK files were found."
            exit 1
          fi
          ls -lh apk-output

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAgent-debug-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

# Trigger rebuild for the uploaded original UI project.
